[package]
name = "pagetriage-wasm"
description = "Browser/Node WASM bindings for pagetriage (wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Published as an npm package (scripts/package-npm.sh), not as a crate.
publish = false
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# PDF structural layer (modules M1, M2, M12). Off by default: the pixel-only build stays small.
pdf = ["pagetriage-core/pdf"]

[dependencies]
pagetriage-core.workspace = true
# Pinned exactly: the wasm-bindgen CLI that post-processes the .wasm must be the same version.
# `scripts/build-wasm.sh` and CI install `wasm-bindgen-cli` at the version in this line.
wasm-bindgen = "=0.2.129"
