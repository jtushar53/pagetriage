# Redaction boxes (module M12, pixel part): solid dark rectangles with straight edges that sit in or
# against running text, as when a name or a number is blacked out. No model. Every key says where it
# comes from. "placeholder" means a first guess not yet checked against data. Nothing here has been
# checked on a real redacted document. White-out boxes cannot be found this way (they are paper).

# ---- the box ---------------------------------------------------------------------------------

# A pixel is dark when its gray is at least this far below the paper level (the page's most common
# bright gray). Ink and redaction boxes are both dark; the boxes are the big rectangles. The layout's
# ink mask is not used: Sauvola leaves the inside of a big solid block as background. Source:
# placeholder.
dark_delta = 120

# Share of the component's bounding box that is ink, and the share of each of the four edges (the
# outer two rows or columns, which absorbs the staircase of a rotated or blurred edge) that is ink. A solid rectangle is near 1 on both; a logo, a ring or a letter
# is not. Source: placeholder.
min_fill = 0.9
min_edge = 0.9

# Size window in x-heights of the page's text: at least this tall and wide (a filled checkbox is
# about 1.8 x-heights square; so a one- or two-letter word is not found either), and no taller than `max_height_xh` (a paragraph blocked out is about
# ten lines; anything taller is a graphic). Source: placeholder.
min_height_xh = 0.8
min_width_xh = 2.2
max_height_xh = 14.0

# Boxes at least this many x-heights thick that are very long and thin are heavy rules, not
# redactions: the aspect (long over short) is at most this. Source: placeholder.
max_aspect = 40.0

# ---- context ---------------------------------------------------------------------------------

# Running text near the box: glyphs of the layout within this many x-heights to the left or right of
# the box, whose vertical extent overlaps the box's by at least half of the glyph's height, are the
# box's line neighbours; glyphs within this many x-heights above or below, overlapping horizontally,
# are its column neighbours. Source: placeholder.
neighbour_xh = 3.0

# ---- scoring ---------------------------------------------------------------------------------

# Confidence = sigmoid(prior + sum of terms), each coef * (value - threshold) clipped to +-term_clip.
# Terms: how many sides have running text next to the box (0 to 4) and how solid it is. Source:
# placeholder (uncalibrated).
term_clip = 4.0
prior = -1.5
neighbour_threshold = 0.9
neighbour_coef = 1.4
solid_threshold = 0.95
solid_coef = 8.0

# At most this many boxes per page. Source: placeholder.
max_boxes = 64
