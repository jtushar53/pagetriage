# Howe's Laplacian-energy binariser: a graph cut over per-pixel Laplacian label costs and
# Canny-edge-aware neighbour penalties, with the penalty c and the high Canny threshold tuned per
# image by a stability criterion.
# Source for everything below unless a line says otherwise: N. R. Howe, "Document binarization with
# automatic parameter tuning", IJDAR 16(3):247-258, 2013 (author's manuscript). Section and table
# numbers refer to that paper. Intensities are 0..255.

# "static": one graph cut with static_c and static_t_hi.
# "tune_c": tune c per image (Algorithm 1) at static_t_hi.
# "dual":   tune c, and choose t_hi from {tau1, tau2} (Algorithm 3). The paper's best method.
mode = "dual"

# Gaussian sigma (the paper calls it a "radius") of the local mean and standard deviation used to
# find bright outlier pixels (Sec. 2.1, r = 20).
radius = 20.0

# A pixel is a bright outlier when it is more than this many local standard deviations above the
# local mean (Sec. 2.1, "two standard deviations").
outlier_sigmas = 2.0

# Label cost that forces bright outliers to background, in MATLAB `del2` units (Sec. 2.1,
# phi = -500). Equation 4 prints it as the (negative) cost of the ink label; its stated purpose is
# to force background, so the ink cost is set to -phi here.
phi = -500.0

# Solver cost units per unit of the paper's costs (c, phi and the Laplacian). The solver works on the
# exact integer 5-point Laplacian S = N + S + E + W - 4 * centre. 1.0 reads the paper's Laplacian as
# that plain sum; 4.0 would read it as MATLAB's `del2` (S / 4) and multiply c and phi by 4.
# Source: assumption, the paper does not say which Laplacian it uses. Chosen on DIBCO 2009 +
# H-DIBCO 2010 only (never 2011): with 1.0 the tuned binarisation (mode "tune_c") is sane on all 20
# images (mean F 93.60, published 92.97 on the same images); with 4.0 tuning collapses to an
# almost uniform page on 5 of 20 (F between 4 and 44) because the scan range then reaches the
# regime where the output stops changing at all and the tuner mistakes that for the stable zone.
cost_scale = 1.0

# Canny: lower hysteresis threshold and smoothing sigma, both fixed (Table 2 "Static" column,
# trained on DIBCO 2009 + H-DIBCO 2010). Thresholds are fractions of the largest gradient
# magnitude (assumption: MATLAB `edge` convention). t_lo matters: weak edges linked to strong ones
# make cuts free, so a soft stain boundary can turn into "ink". Scan on DIBCO 2009 + 2010 with the
# derivative-of-Gaussian gradient, mean F over 20 images: mode "tune_c": t_lo 0.1 -> 93.74,
# 0.15 -> 93.39, 0.2 -> 92.06; mode "dual": 0.1 -> 94.01, 0.15 -> 94.25, 0.2 -> 93.74. The paper's
# 0.1 is kept: best for tune_c, and 0.15 is better for dual by only 0.24, below the margin (0.5)
# we require to depart from a published setting.
t_lo = 0.1
sigma_e = 0.6

# Static c and high Canny threshold (Table 2 "Static" column).
static_c = 160.0
static_t_hi = 0.4

# The two candidate high Canny thresholds of Algorithm 3 (Sec. 2.3).
tau1 = 0.25
tau2 = 0.5

# Candidate c values for Algorithm 1: c_i = c_start * 2^(i / steps_per_octave), i = 0..=c_steps
# (40 to 5120 at 4 steps per octave).
c_start = 40.0
c_steps = 28
steps_per_octave = 4

# Taps of the Gaussian of radius 1 that smooths the instability curve (Algorithm 1).
curve_smoothing = [0.02, 0.13, 0.35, 0.35, 0.13, 0.02]
