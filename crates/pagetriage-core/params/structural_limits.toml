# Resource limits of the PDF structural layer. The input is untrusted: a malformed, huge or hostile
# file must end in an error or a degraded result, never a hang or an out-of-memory abort.
# Every value is an engineering limit (not tuned on data). The size, page and total-content caps
# were raised on 2026-10-24 so that a 13,000-page, 400 MB tender document (engineering drawings,
# vector-heavy pages) is analysed whole by the native CLI; the browser demo applies its own smaller
# caps before calling the library.

# Largest PDF accepted, in bytes (1 GiB). Peak memory was about 2.6 times the file size on a
# 651 MB, 13,000-page synthetic scan (1.68 GB); the ratio is higher for small files with many pages.
max_input_bytes = 1073741824

# Largest size any one stream may decompress to (object streams, content streams, CMaps).
max_decompressed_bytes = 67108864

# Objects in the document (after parsing). More is refused as too large.
max_objects = 3000000

# Pages analysed. Later pages are left out and a warning is added.
max_pages = 100000

# Depth of the page tree walked.
max_page_tree_depth = 48

# Form XObject nesting followed while reading a page's content.
max_form_depth = 8

# Form XObjects executed per page (each counted once per use).
max_forms_per_page = 256

# Decoded content bytes read for one page, forms included.
max_content_bytes_per_page = 67108864

# Decoded content bytes read across the whole document (64 GiB: a work bound, not memory; pages
# are decoded one at a time). When exhausted, the remaining pages are reported without a
# text-layer verdict.
max_content_bytes_total = 68719476736

# Operators executed per page.
max_ops_per_page = 4000000

# Operands kept on the operand stack (older ones are dropped).
max_operands = 64

# Depth of the q/Q graphics-state stack.
max_q_depth = 64

# Distinct fonts examined per page.
max_fonts_per_page = 128

# Images listed per page.
max_images_per_page = 64
