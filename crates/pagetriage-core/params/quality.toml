# Degradation triage (module M3): skew, blur, contrast, speckle, bleed-through, fold lines,
# photocopy generation, binariser choice and grade. Every key says where it comes from. "placeholder"
# means a first guess that has not been checked against data yet.

# ---- text mask -------------------------------------------------------------------------------

# A connected component counts as text (for skew, x-height and the stroke statistics) only if it
# has at least this many ink pixels. Source: placeholder.
text_min_area = 3

# A component whose bounding box spans this fraction of the page width or height is not text: page
# frames, table rules, fold shadows and the edge of a rotated scan. Source: placeholder.
text_max_extent_frac = 0.4

# Components with fewer pixels than this are ignored when estimating the text height, so that
# specks cannot drag the median down. Source: placeholder.
xheight_min_area = 6

# Text height in pixels when no component is large enough to measure it (near-blank pages).
# Source: placeholder (about a 10 pt x-height at 150 dpi).
xheight_fallback_px = 10.0

# ---- tone ------------------------------------------------------------------------------------

# The ink level is this percentile of the gray of text ink pixels (0.1 = the darkest tenth), so a
# few black specks cannot set it and anti-aliased grays do not dominate it. Source: placeholder.
ink_level_percentile = 0.1

# ---- speckle ---------------------------------------------------------------------------------

# A component is a speck when its bounding box is at most this fraction of the text height on both
# sides (module M3 definition: 0.15 x median x-height; the text height is a proxy for x-height, see
# docs/detectors/quality.md) ...
speck_xheight_frac = 0.15

# ... but never less than this many pixels, so 1-2 px noise counts as speckle at any resolution.
# Source: placeholder.
speck_min_side_px = 2

# ---- blur ------------------------------------------------------------------------------------

# The Laplacian variance is taken over ink pixels of text components plus this many pixels around
# them, so both sides of every edge are included. Source: placeholder.
blur_dilate_px = 1

# Edge sharpness is turned into a blur radius, 1 / (sqrt(2) * sharpness) pixels (a Gaussian step
# edge). A page with a gradient-free text mask gets this value instead of infinity.
# Source: numerical guard, not a tuned value.
blur_sigma_cap_px = 10.0

# The text mask's Laplacian power above the paper's noise floor must be at least this multiple of
# the floor, or the edges are no stronger than the noise and the page is read as "very blurred"
# (blur_sigma_cap_px). Source: placeholder; chosen on the synthetic blur sweep of
# bench/quality_synth_eval.py.
blur_min_snr = 4.0

# ---- paper level grid ------------------------------------------------------------------------

# Paper (pixels that are neither ink nor next to ink) is averaged on a grid of blocks this many
# pixels wide. Used by the bleed-through and fold-line measures. Source: placeholder.
paper_block_px = 4

# ---- bleed-through ---------------------------------------------------------------------------

# The local paper level is the paper mean averaged over this many blocks in every direction.
# Source: placeholder.
bleed_bg_radius_blocks = 6

# Paper pixels within this many pixels of front ink are ignored (anti-aliased edges, halos).
# Source: placeholder.
bleed_exclude_px = 2

# "Strong" (front-side) ink is a pixel at least this fraction of the ink/paper gap below the local
# paper level. Faint pixels are looked for only clear of it. Source: placeholder; tuned on the
# synthetic show-through sweep of bench/quality_synth_eval.py and the tune sets.
bleed_strong_frac = 0.5

# A paper pixel is "faint ink" when it is at least this fraction of the ink/paper gap below the
# local paper level, and at least `bleed_ghost_floor_levels` gray levels below it. Source:
# placeholder; tuned on the tune sets of docs/detectors/quality.md.
bleed_ghost_min_frac = 0.1
bleed_ghost_floor_levels = 6.0

# The threshold is also at least this many robust standard deviations of the paper's own gray
# noise (1.4826 x the median absolute deviation of the drops), so textured paper and sensor noise
# are not called bleed-through. Source: placeholder; tuned on the tune sets.
bleed_noise_sigmas = 4.0

# Faint pixels count as ghost strokes only in connected components of at least this many pixels.
# Source: placeholder.
bleed_ghost_min_area = 6

# ... and only if their mean width (area over centre-line length) is at most this multiple of the
# text's own median stroke width: faint blobs (stains, shadows) are not reverse-side strokes.
# Source: placeholder; tuned on the tune sets.
bleed_ghost_max_width_ratio = 2.0

# The exclusion radius around front ink is at least this multiple of the median text stroke width
# (thick strokes have wider anti-aliased and blurred halos). Source: placeholder.
bleed_exclude_stroke_mult = 2.0

# Faint-pixel share of the paper pixels (`mid_mass`) that scores 1, and ghost-stroke ratio that
# scores 1. The bleed-through score is a weighted mean of the two, weight below on `mid_mass`.
# Source: placeholder; tuned on the tune sets.
bleed_mid_mass_full = 0.03
bleed_ghost_ratio_full = 0.2
bleed_weight_mid = 0.5

# ---- fold lines ------------------------------------------------------------------------------

# A fold is a narrow valley in the paper shading: the block value is lower than the mean of the
# two blocks this many blocks to either side. Source: placeholder (about 12 px at 150 dpi).
fold_arm_blocks = 3

# A block needs this many clear-paper pixels to have a value, and a line of blocks this fraction
# of valid blocks to enter the profile. Source: placeholder.
fold_min_block_pixels = 4
fold_min_valid_frac = 0.2

# Valley depth range in gray levels: at least this (shallower is paper texture), and at most this
# fraction of the ink/paper gap ("low contrast": anything darker is ink or a ruling).
# Source: placeholder.
fold_min_depth_levels = 5.0
fold_max_depth_gap_frac = 0.35

# A fold is long: a line shorter than this many inches (at the page's dpi) is not searched, so
# crops and strips are not mistaken for pages. Source: placeholder; DIBCO crops are mostly shorter.
fold_min_length_in = 3.0

# Of the columns (rows) where the valley can be measured at all, this fraction must show at least
# half of it, allowing one block of tilt: "near full width". Source: placeholder.
fold_min_coverage = 0.8

# At least this fraction of all columns (rows) must be measurable (text and stamps hide the paper
# in the others), so a short valley between two text lines does not pass. Source: placeholder.
fold_min_measurable = 0.25

# A crease is narrow: the valley depth two blocks out must be at least this fraction of the depth
# at the full arm. Source: placeholder.
fold_min_narrowness = 0.6

# Valleys closer than this many blocks to the page edge are ignored (scan edges, binding shadows;
# 10 blocks is 40 px, 6.8 mm at 150 dpi). Source: placeholder.
fold_edge_margin_blocks = 10

# ... and, as a fraction of the page's extent across the fold, at least this far from either edge:
# margin rules and scan borders sit there, creases usually do not (halves, thirds, quarters).
# Source: placeholder, set after looking at DIBCO false alarms (tune sets).
fold_edge_margin_frac = 0.1

# One-sided shading: the difference between the mean paper level on the two sides of the valley
# (over the arm), as a fraction of the valley depth, must lie in this range. Below the minimum is a
# symmetric line (a printed or pencilled rule); above the maximum is the edge of a region (binding,
# scanner bed). Source: placeholder, set after looking at DIBCO false alarms (tune sets).
fold_min_shading = 0.15
fold_max_shading = 1.0

# More than this many valleys in one direction are rulings or ruled paper, not folds: a sheet has
# a handful of creases at most (letter fold 2, quarter fold 3). Source: common sense.
fold_max_lines = 4

# ---- photocopy generation (experimental) -----------------------------------------------------
# No published method found. Five measurements are each turned into a severity (0 at "good", 1 at
# "bad"), averaged with the weights below, and scaled to 0..gen_max_generation. None of this has
# been validated on real photocopies. Every value is a placeholder.

# Fewer text components than this: no estimate (null).
gen_min_components = 20

# Confidence grows linearly with the number of text components up to this count ...
gen_full_confidence_components = 300

# ... and never exceeds this. Source: module M3 definition (experimental, capped at 0.6).
gen_max_confidence = 0.6

# The estimate is a whole number from 0 (looks like an original) to this.
gen_max_generation = 5

# A text component smaller than this fraction of the median text component is a fragment.
gen_fragment_area_frac = 0.25

# Coefficient of variation of stroke width (std / mean over stroke centre-line pixels).
gen_cv_good = 0.25
gen_cv_bad = 0.6
# Mean stroke width over the text height; falls with each generation (module M3 definition).
gen_width_good = 0.2
gen_width_bad = 0.08
# Share of text components that are fragments (broken characters).
gen_fragment_good = 0.1
gen_fragment_bad = 0.4
# Speckle density, as for the grade.
gen_speckle_good = 0.0003
gen_speckle_bad = 0.003
# Ink/paper gap, lower is worse.
gen_gap_good = 0.7
gen_gap_bad = 0.3

gen_w_cv = 1.0
gen_w_width = 1.0
gen_w_fragment = 1.0
gen_w_speckle = 1.0
gen_w_gap = 1.0

# ---- grade and binariser ---------------------------------------------------------------------
# Each measure becomes a severity: 0 at "good", 1 at "bad", linear in between. badness =
# grade_w_max * worst severity + (1 - grade_w_max) * weighted mean severity. The grade is A below
# grade_a_max, B below grade_b_max, C below grade_c_max, D otherwise. All placeholders until tuned
# against the benchmark sets.

# Skew in degrees (|skew|). Small skews are harmless, so this also has a low weight.
grade_skew_good = 0.5
grade_skew_bad = 5.0
# Blur index in millimetres at the page's dpi (0.12 mm is 0.7 px at 150 dpi): the edge-based radius
# (see blur_sigma_px), which reads about 0.6 of a Gaussian blur's true radius on thin strokes.
# Source: placeholder, set on the synthetic blur sweep of bench/quality_synth_eval.py.
grade_blur_good = 0.12
grade_blur_bad = 0.22
# Ink/paper gap, lower is worse.
grade_gap_good = 0.5
grade_gap_bad = 0.2
# Speckles per page pixel.
grade_speckle_good = 0.0003
grade_speckle_bad = 0.003
# Bleed-through score.
grade_bleed_good = 0.3
grade_bleed_bad = 0.9
# Fold line count.
grade_folds_good = 0.0
grade_folds_bad = 3.0

grade_w_skew = 0.5
grade_w_blur = 1.0
grade_w_gap = 1.0
grade_w_speckle = 0.7
grade_w_bleed = 1.0
grade_w_folds = 0.5

grade_w_max = 0.5
grade_a_max = 0.15
grade_b_max = 0.35
grade_c_max = 0.6

# Recommend Howe instead of Sauvola when the bleed-through score is at least this ...
howe_bleed_min = 0.5
# ... or the ink/paper gap is below this ...
howe_gap_max = 0.25
# ... but only when at least this fraction of the page is text ink (a blank page has nothing to
# binarise). Source: module M3 definition for the rule; the numbers are placeholders.
howe_min_ink_fraction = 0.002

# ---- skew ------------------------------------------------------------------------------------

# Search range in degrees either side of zero. Source: module M3 definition (+-15).
skew_range_deg = 15.0

# Coarse sweep step. Source: module M3 definition (0.5 degrees).
skew_coarse_step_deg = 0.5

# Fine sweep step. Source: module M3 definition (0.05 degrees).
skew_fine_step_deg = 0.05

# The fine sweep covers the coarse candidate +- this many degrees. Source: one coarse step, so the
# true peak cannot hide between two coarse samples.
skew_fine_halfwidth_deg = 0.5

# How many of the best coarse local maxima get a fine sweep. Source: placeholder.
skew_refine_candidates = 3

# "variance" (sum of squared bin counts) or "gradient" (sum of squared adjacent differences).
# Source: variance is the classic projection-profile criterion; tuned on <none yet>.
skew_criterion = "variance"

# Skew uses only the centre lines (ridges of the distance transform) of strokes. Ridges thicker
# than this multiple of the page's median ridge value are dropped: they are blobs, stains, or the
# dark band Sauvola leaves beside a scan edge, not text. Source: placeholder; tuned on the tune
# sets of bench/skew_eval.py.
skew_max_stroke_ratio = 10.0

# Profile bins per pixel of perpendicular offset (1 = one bin per pixel). Source: placeholder.
skew_bin_scale = 1.0

# Fewer ink points than this: report 0 degrees. Source: placeholder.
skew_min_points = 200

# More ink points than this are thinned by a fixed stride (every k-th in raster order) so the cost
# stays bounded. Source: placeholder; chosen for the 100 ms budget at 150 dpi A4.
skew_max_points = 60000
