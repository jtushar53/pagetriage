[package]
name = "pagetriage-core"
description = "Deterministic, non-ML page-content analyser for degraded scanned legal documents (core crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# PDF structural layer (modules M1, M2 and the structure part of M12): parses PDF files with
# `lopdf`. Off by default so the pixel-only build (and its WASM size) does not carry a PDF parser.
# `lopdf` is built without its default features (no rayon threads, no clock), see
# docs/detectors/text_layer.md for why `pdf-inspector` is not used.
pdf = ["dep:lopdf"]

[dependencies]
libm = "0.2.16"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.46.0", default-features = false, optional = true }

# On wasm32-unknown-unknown lopdf's `getrandom` needs the `wasm_js` backend to compile at all.
# The random-number code (PDF encryption writing) is never reached by the structural analyser, so
# the linker drops it and the module needs no JS import for it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.46.0", default-features = false, features = ["wasm_js"], optional = true }

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
