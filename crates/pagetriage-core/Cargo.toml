[package]
name = "pagetriage-core"
description = "Deterministic, non-ML page-content analyser for degraded scanned legal documents (core crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libm = "0.2.16"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
