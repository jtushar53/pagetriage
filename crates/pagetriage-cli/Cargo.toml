[package]
name = "pagetriage-cli"
description = "Command-line front end for pagetriage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pagetriage"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "pnm", "bmp"] }
pagetriage-core.workspace = true
serde_json = "1.0.154"
