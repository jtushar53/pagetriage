[package]
name = "pagetriage-py"
description = "Python bindings for pagetriage (PyO3, built with maturin)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pagetriage_py"
crate-type = ["cdylib"]

[dependencies]
pagetriage-core = { workspace = true, features = ["pdf"] }
# abi3: one wheel per platform that works on every CPython >= 3.9.
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
