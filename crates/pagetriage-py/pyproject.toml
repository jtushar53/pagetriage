[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pagetriage"
description = "Deterministic, non-ML page-content analyser for degraded scanned legal documents"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[tool.maturin]
module-name = "pagetriage_py"
features = ["pyo3/extension-module"]
