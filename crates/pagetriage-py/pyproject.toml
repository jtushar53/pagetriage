[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pagetriage"
description = "Deterministic, non-ML page-content analyser for degraded scanned legal documents"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
keywords = ["document-analysis", "scanned-documents", "deterministic", "ocr-triage", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jtushar53/pagetriage"
Repository = "https://github.com/jtushar53/pagetriage"
Documentation = "https://github.com/jtushar53/pagetriage/tree/main/docs"

[tool.maturin]
module-name = "pagetriage_py"
features = ["pyo3/extension-module"]
