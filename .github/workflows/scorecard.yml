# OpenSSF Scorecard: an automated review of the repository's security practices (branch protection,
# pinned dependencies, token permissions, ...). Results appear in the Security tab and at
# https://securityscorecards.dev/viewer/?uri=github.com/jtushar53/pagetriage. Free for public repos.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
