# Determinism rule (PLAN.md section d): native, Python and WASM builds must produce byte-identical
# JSON. IEEE-754 +, -, *, / and sqrt are exactly specified, but the transcendental functions below
# are delegated to the platform libm (glibc, Apple libm, wasm compiler-builtins) and can differ in
# the last ulp. Call the `pagetriage_core::math` wrappers instead; they use the pure-Rust `libm`
# crate on every target.
disallowed-methods = [
    { path = "f64::exp", reason = "use pagetriage_core::math::exp (platform libm is not bit-reproducible)" },
    { path = "f64::exp2", reason = "use pagetriage_core::math::exp (platform libm is not bit-reproducible)" },
    { path = "f64::exp_m1", reason = "platform libm is not bit-reproducible" },
    { path = "f64::ln", reason = "use pagetriage_core::math::ln (platform libm is not bit-reproducible)" },
    { path = "f64::ln_1p", reason = "platform libm is not bit-reproducible" },
    { path = "f64::log", reason = "use pagetriage_core::math::ln (platform libm is not bit-reproducible)" },
    { path = "f64::log2", reason = "use pagetriage_core::math::ln (platform libm is not bit-reproducible)" },
    { path = "f64::log10", reason = "use pagetriage_core::math::ln (platform libm is not bit-reproducible)" },
    { path = "f64::powf", reason = "use pagetriage_core::math::pow (platform libm is not bit-reproducible)" },
    { path = "f64::powi", reason = "use pagetriage_core::math::pow (compiler-rt powi differs per target)" },
    { path = "f64::sin", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::tan", reason = "platform libm is not bit-reproducible" },
    { path = "f64::asin", reason = "platform libm is not bit-reproducible" },
    { path = "f64::acos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atan", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atan2", reason = "platform libm is not bit-reproducible" },
    { path = "f64::sinh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cosh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::tanh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cbrt", reason = "platform libm is not bit-reproducible" },
    { path = "f64::hypot", reason = "platform libm is not bit-reproducible" },
]
