# whether it needs a login are all unconfirmed. The URL and the "(33 MB)" figure come from a
# Wayback Machine copy of the dataset page. The original UMD LAMP hosts no longer resolve, and
# the Zenodo/Hugging Face copies are splits, redacted or derived, so they are not used.
# fetch.py fails with a clear message if the host is down; check size, hash and tar contents on the
# first successful fetch, then pin them here and set verified = true.
